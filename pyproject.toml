[project]
name = "nsamble-scanner"
version = "0.1.0"
description = "Photogrammetry turntable scanner pipeline"
requires-python = ">=3.10"
dependencies = [
    "opencv-contrib-python>=4.9",
    "numpy>=1.24",
    "open3d>=0.18",
    "svgwrite>=1.4",
]

[project.scripts]
nsamble-scan = "scanner.__main__:main"
